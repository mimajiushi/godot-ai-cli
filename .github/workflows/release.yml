# Release: on a vX.Y.Z tag push, build the six platform binaries with the
# version stamped via ldflags, package them into the naming contract that
# internal/update consumes (godot-ai-cli-<ver>-<goos>-<goarch>.zip +
# godot-ai-cli-<ver>-checksums.txt), add the godot-ai-skill.zip bundle, and
# publish a GitHub release with auto-generated notes.
#
# `workflow_dispatch` is a dry-run: same build and packaging, but artifacts
# are only uploaded to the workflow run — no release is created.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (x.y.z) — dry-run only, no release is created"
        required: false
        default: "0.1.0"
        type: string

permissions:
  contents: write

jobs:
  # The repo's internal/version.Version is ldflags-injected (default
  # "0.0.0-dev"), so the only version gate is the tag shape; the build below
  # stamps the real version into the binary.
  validate:
    name: validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_tag: ${{ steps.ver.outputs.is_tag }}
    steps:
      - name: Resolve and validate the semver version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            # Strict semver tags only: vX.Y.Z or vX.Y.Z-<prerelease>.
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag '$tag' is not v<semver> (vX.Y.Z or vX.Y.Z-<prerelease>)"
              exit 1
            fi
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            ver="${{ inputs.version }}"
            if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::version input '$ver' is not <semver> (x.y.z or x.y.z-<prerelease>)"
              exit 1
            fi
            echo "version=$ver" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (version stamped via ldflags)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          bin="godot-ai-cli"
          [ "$GOOS" = "windows" ] && bin="godot-ai-cli.exe"
          mkdir -p out
          go build -trimpath \
            -ldflags "-s -w -X github.com/mimajiushi/godot-ai-cli/internal/version.Version=$VERSION" \
            -o "out/$bin" ./cmd/godot-ai-cli

      # The zip MUST contain only godot-ai-cli[.exe] at its root — this is
      # the contract internal/update.ExtractBinary relies on.
      - name: Package zip (update-asset contract)
        run: |
          set -euo pipefail
          bin="godot-ai-cli"
          [ "${{ matrix.goos }}" = "windows" ] && bin="godot-ai-cli.exe"
          zip -j "godot-ai-cli-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "out/$bin"

      - uses: actions/upload-artifact@v4
        with:
          name: godot-ai-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: godot-ai-cli-*.zip
          retention-days: 7

  release:
    name: package + publish
    needs: [validate, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      # skill/ is the bundled agent-skill snapshot (see script/sync-skill.sh).
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: godot-ai-cli-*
          path: dist
          merge-multiple: true

      # `<sha256>  <filename>` lines — the exact format
      # internal/update.verifyChecksum parses.
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum godot-ai-cli-*.zip > "godot-ai-cli-${VERSION}-checksums.txt"

      # R-8a：SKILL.md 里的两处 ops 计数不再手工维护。唯一真源是**本次发布所带
      # 二进制**的 coverage 行（`godot-ai-cli -v` -> `plugin command coverage: N ops`，
      # 即 len(ops.All())）；references/commands.md 的标题带同一个数字，因为两者都
      # 渲染自同一张 op 表。先断言（SKILL.md 漂移就让流水线失败），再用这个二进制
      # 渲染，随包 zip 就永远不会与它旁边的二进制打架。本地跑法共用同一脚本：
      # bash script/skill-ops-count.sh --check --bin ./godot-ai-cli.exe --dir ../godot-ai-skill
      - name: Sync the skill ops count from the release binary (R-8a)
        run: |
          set -euo pipefail
          mkdir -p skillbin
          unzip -q -o "dist/godot-ai-cli-${VERSION}-linux-amd64.zip" -d skillbin
          chmod +x skillbin/godot-ai-cli
          bash script/skill-ops-count.sh --check  --bin skillbin/godot-ai-cli --dir skill
          bash script/skill-ops-count.sh --render --bin skillbin/godot-ai-cli --dir skill

      # The agent skill ships alongside the binaries: SKILL.md, scripts/,
      # references/ — everything under skill/ except OS junk.
      - name: Package the agent skill
        run: |
          set -euo pipefail
          test -f skill/SKILL.md
          cd skill
          zip -r "../dist/godot-ai-skill.zip" . -x "*.DS_Store" -x "*Thumbs.db" -x "*desktop.ini"

      # R-8b：解包即将发布的产物，断言它必须自洽的三处计数——SKILL.md 前言
      # （`~N editor ops`）、SKILL.md 的 Need/Read 表格行（`the N ops`）与
      # references/commands.md 的标题行——都要等于**同一个**二进制的 coverage。
      # 任何一处不一致都在发布会前让流水线失败。
      - name: Assert the packaged skill counts the shipped ops (R-8b)
        run: |
          set -euo pipefail
          rm -rf skill-unpacked
          unzip -q "dist/godot-ai-skill.zip" -d skill-unpacked
          bash script/skill-ops-count.sh --check --bin skillbin/godot-ai-cli --dir skill-unpacked

      - name: Upload dry-run artifacts
        if: needs.validate.outputs.is_tag == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ env.VERSION }}
          path: dist/
          retention-days: 7

      - name: Create GitHub release
        if: needs.validate.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # 正文取自仓库根的 RELEASE_NOTES.md（每个版本发布前必须重写为
          # 人话 changelog——只丢自动生成链接的 release 不合格）；
          # generate_release_notes 会把自动 compare 链接追加在正文之后。
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # vX.Y.Z-<anything> publishes as a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
